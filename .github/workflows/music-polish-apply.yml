name: Apply expressive music polish

on:
  push:
    branches:
      - feature/live-activities-dynamic-island

permissions:
  contents: write
  actions: read

concurrency:
  group: expressive-music-polish-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.head_commit.message == '[TEST] cover expressive music presentation options'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact RED head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Confirm branch ancestry
        env:
          BASE: 54cc9c133a26cb084ccaeb823acdf9a9fb8408e4
          TRACK_KEY_FIX: 05a5cc1075e2b913a09954c01dc07498bac4e212
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "feature/live-activities-dynamic-island"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$BASE" HEAD
          git merge-base --is-ancestor "$TRACK_KEY_FIX" HEAD
          test "$(git rev-parse HEAD^)" = "$TRACK_KEY_FIX"
          git status --short

      - name: Require the new tests to be RED first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          found=0
          for _ in $(seq 1 90); do
            line="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&event=push&per_page=20" \
              --jq '.workflow_runs[] | select(.name == "Build") | [.id,.status,.conclusion] | @tsv' | head -n1 || true)"
            if [ -n "$line" ]; then
              found=1
              IFS=$'\t' read -r run_id status conclusion <<< "$line"
              echo "BUILD_RUN=$run_id STATUS=$status CONCLUSION=$conclusion"
              if [ "$status" = "completed" ]; then
                test "$conclusion" = "failure"
                exit 0
              fi
            fi
            sleep 10
          done
          test "$found" = 1
          echo "Build did not reach terminal RED state" >&2
          exit 1

      - name: Prepare compiler-gated applicator
        run: |
          set -euo pipefail
          test "$(git hash-object .github/scripts/apply_music_polish.py)" = "07c5aa80d43da1e31e7d13635f4a4804cc4f3628"
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('.github/scripts/apply_music_polish.py')
          text = path.read_text()
          edits = [
              ('import androidx.compose.animation.core.animateColorAsState',
               'import androidx.compose.animation.animateColorAsState'),
              ('material3 = "1.4.0"', 'material3 = "1.4.0-alpha18"'),
          ]
          for old, new in edits:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'compiler-gated edit mismatch: {old!r} count={count}')
              text = text.replace(old, new, 1)
          data = text.encode()
          compile(text, str(path), 'exec')
          path.write_text(text)
          print(f'APPLICATOR_SIZE={len(data)}')
          print(f'APPLICATOR_SHA256={hashlib.sha256(data).hexdigest()}')
          print('APPLICATOR_SYNTAX=PASS')
          PY

      - name: Apply bounded music polish
        run: python .github/scripts/apply_music_polish.py

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: Scope and whitespace audit
        env:
          BASE: 54cc9c133a26cb084ccaeb823acdf9a9fb8408e4
        run: |
          set -euo pipefail
          git diff --check
          for path in \
            app/src/main/java/com/ekoehler/expressivecutout/events/MediaPlaybackMonitor.kt \
            app/src/main/java/com/ekoehler/expressivecutout/events/NotificationMediaSessionRegistry.kt \
            app/src/main/java/com/ekoehler/expressivecutout/service/CutoutNotificationListenerService.kt \
            app/src/main/java/com/ekoehler/expressivecutout/core/live/LiveActivityRegistry.kt \
            app/src/main/java/com/ekoehler/expressivecutout/core/live/LiveActivityCoordinator.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/IslandMotion.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/IslandMotionPolicy.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/IslandMotionProfile.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/IslandSatellite.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/SatelliteContentTransition.kt \
            app/src/main/java/com/ekoehler/expressivecutout/overlay/PrimaryContentTransition.kt \
            app/src/main/java/com/ekoehler/expressivecutout/system/StatusBarPulseDeadline.kt \
            app/build.gradle.kts; do
            git diff --exit-code "$BASE" -- "$path"
          done
          test -z "$(git diff --name-only "$BASE" -- app/src/main/java/com/ekoehler/expressivecutout/notifications/live)"
          test "$(git show "$BASE":app/src/main/java/com/ekoehler/expressivecutout/overlay/DynamicIsland.kt | grep -c 'contentKey = ::primaryContentKey')" = \
               "$(grep -c 'contentKey = ::primaryContentKey' app/src/main/java/com/ekoehler/expressivecutout/overlay/DynamicIsland.kt)"
          grep -q 'versionCode = 4' app/build.gradle.kts
          grep -q 'versionName = "0.2.0-beta"' app/build.gradle.kts

      - name: Commit final feature and remove temporary applicator
        env:
          BASE: 54cc9c133a26cb084ccaeb823acdf9a9fb8408e4
        run: |
          set -euo pipefail
          rm .github/workflows/music-polish-apply.yml .github/scripts/apply_music_polish.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "[FEAT] add expressive music player options"
          git diff --check "$BASE"..HEAD
          test -z "$(git status --short)"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
          git push origin HEAD:refs/heads/feature/live-activities-dynamic-island
