name: Apply live pulse wiring

on:
  push:
    branches:
      - feature/live-activities-dynamic-island
    paths:
      - .github/workflows/apply-live-pulse-wiring.yml
      - .github/scripts/apply_live_pulse_wiring.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-activities-dynamic-island
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply pulse wiring patch
        run: python3 .github/scripts/apply_live_pulse_wiring.py

      - name: Verify unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Verify assemble
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify lint
        continue-on-error: true
        run: ./gradlew lintDebug --no-daemon

      - name: Commit runtime wiring and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-live-pulse-wiring.yml .github/scripts/apply_live_pulse_wiring.py
          git add app/src/main/java app/src/test/java
          git diff --cached --check
          git commit -m "[FEAT] trigger status bar pulse for new live activities"
          git push origin HEAD:feature/live-activities-dynamic-island
