name: Apply live activity listener wiring

on:
  push:
    branches:
      - feature/live-activities-dynamic-island
    paths:
      - .github/workflows/apply-live-wiring.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/live-activities-dynamic-island
          fetch-depth: 0

      - name: Apply exact wiring patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          listener_path = Path("app/src/main/java/com/ekoehler/expressivecutout/service/CutoutNotificationListenerService.kt")
          listener = listener_path.read_text()

          listener = replace_once(
              listener,
              "import com.ekoehler.expressivecutout.core.RunningTimerBus\n",
              "import com.ekoehler.expressivecutout.core.RunningTimerBus\n"
              "import com.ekoehler.expressivecutout.core.live.LiveActivity\n"
              "import com.ekoehler.expressivecutout.core.live.LiveActivityRegistry\n",
              "listener live imports",
          )
          listener = replace_once(
              listener,
              "import com.ekoehler.expressivecutout.events.TimerNotificationParser\n",
              "import com.ekoehler.expressivecutout.events.TimerNotificationParser\n"
              "import com.ekoehler.expressivecutout.notifications.live.NotificationLiveActivityBridge\n"
              "import com.ekoehler.expressivecutout.notifications.live.NotificationLiveActivityProcessor\n"
              "import com.ekoehler.expressivecutout.notifications.live.NotificationLiveActivityRouter\n"
              "import com.ekoehler.expressivecutout.notifications.live.NotificationLiveSignalsExtractor\n"
              "import com.ekoehler.expressivecutout.notifications.live.SpecializedLiveActivityFactory\n",
              "listener routing imports",
          )
          listener = replace_once(
              listener,
              "    private val alerter by lazy { NotificationAlerter(this) }\n\n",
              "    private val alerter by lazy { NotificationAlerter(this) }\n\n"
              "    /** Applies notification-owned live mutations to the process-wide coordinator. */\n"
              "    private val liveActivityBridge by lazy {\n"
              "        NotificationLiveActivityBridge(LiveActivityRegistry.coordinator)\n"
              "    }\n\n",
              "listener bridge property",
          )

          posted_start = listener.index(
              "    override fun onNotificationPosted(sbn: StatusBarNotification?, rankingMap: RankingMap?) {"
          )
          posted_end = listener.index(
              "\n    /**\n     * Cleans up the state a notification left behind once it is gone",
              posted_start,
          )
          posted = '''    override fun onNotificationPosted(sbn: StatusBarNotification?, rankingMap: RankingMap?) {
              val notification = sbn ?: return

              if (CallNotificationParser.isCall(notification)) {
                  handleCall(notification)
                  return
              }

              if (TimerNotificationParser.isTimer(notification)) {
                  handleTimer(notification)
                  return
              }

              notification.publishMediaArt()

              if (pendingCancel.consume(notification.key)) {
                  cancel(notification.key)
                  endMutedReturn()
                  return
              }

              if (returning.consume(notification.key)) {
                  endMutedReturn()
                  return
              }

              val extras = notification.notification.extras
              val title = extras?.getCharSequence(Notification.EXTRA_TITLE)?.toString()
              val text = extras?.getCharSequence(Notification.EXTRA_TEXT)?.toString()
              val progress = getProgressDataOrNull(notification)
              val fingerprint = fingerprint(notification.packageName, title, text)
              val blocked = notification.isExplicitlyBlockedFromLiveRouting() ||
                  suppressedByDnd() ||
                  (progress == null && suppressed.isSuppressed(fingerprint))
              val extracted = NotificationLiveSignalsExtractor.extract(this, notification)
              val result = liveActivityBridge.post(
                  NotificationLiveActivityProcessor.Input(
                      signals = extracted.signals,
                      nativeSnapshot = extracted.nativeSnapshot,
                      isMedia = notification.notification.extras
                          ?.containsKey(Notification.EXTRA_MEDIA_SESSION) == true,
                      blocked = blocked,
                      legacySurfaceable = notification.shouldSurface(),
                      nowElapsedRealtime = SystemClock.elapsedRealtime(),
                  ),
              )

              when (result.route) {
                  NotificationLiveActivityRouter.Route.NATIVE_LIVE,
                  NotificationLiveActivityRouter.Route.PROGRESS_STYLE,
                  NotificationLiveActivityRouter.Route.MEDIA,
                  NotificationLiveActivityRouter.Route.IGNORE,
                  NotificationLiveActivityRouter.Route.CALL,
                  NotificationLiveActivityRouter.Route.TIMER -> return

                  NotificationLiveActivityRouter.Route.SEMANTIC_LIVE -> {
                      if (!result.preserveLegacyPresentation) return
                  }

                  NotificationLiveActivityRouter.Route.LEGACY_NOTIFICATION -> Unit
              }

              val appName = NotificationHeaderResolver.resolveAppName(this, notification.packageName)
              val postTimeMs = NotificationHeaderResolver.resolvePostTimeMs(notification.postTime)
              val isSilent = isSilentNotification(notification, rankingMap)
              val islandEvent = CutoutSignal.Notification(
                  packageName = notification.packageName,
                  title = title,
                  text = text,
                  appName = appName,
                  postTimeMs = postTimeMs,
                  key = notification.key,
                  contentIntent = notification.notification.contentIntent,
                  actions = notification.notification.surfaceableActions(),
                  largeIcon = notification.notification.getLargeIcon(),
                  smallIcon = notification.notification.smallIcon,
                  progressData = progress,
                  isSilent = isSilent,
              )

              IslandEventBus.emit(islandEvent)
              rememberShown(notification.key, fingerprint)

              if (alertOnNotification && progress == null) {
                  alertFor(notification)
              }

              if (dismissNotifications && progress == null && isUserPresent()) {
                  hold(notification.key)
              }
          }
'''
          listener = listener[:posted_start] + posted + listener[posted_end:]

          removed_start = listener.index("    override fun onNotificationRemoved(sbn: StatusBarNotification?) {")
          removed_end = listener.index(
              "\n    /**\n     * Drive the phone tile from a call notification",
              removed_start,
          )
          removed = '''    override fun onNotificationRemoved(sbn: StatusBarNotification?) {
              val removed = sbn
              if (removed != null) {
                  liveActivityBridge.remove(removed.packageName, removed.key)
                  if (CallNotificationParser.isCall(removed)) {
                      LiveActivityRegistry.coordinator.remove(
                          SpecializedLiveActivityFactory.callId(removed.packageName, removed.key),
                      )
                  }
                  if (TimerNotificationParser.isTimer(removed)) {
                      LiveActivityRegistry.coordinator.remove(
                          SpecializedLiveActivityFactory.timerId(removed.packageName, removed.key),
                      )
                  }
              }
              if (removed?.key != null && removed.key == currentCallKey) {
                  currentCallKey = null
                  OnCallBus.update(null)
              }
              if (removed?.key != null && removed.key == currentTimerKey) {
                  currentTimerKey = null
                  RunningTimerBus.update(null)
              }
              if (removed?.key != null && removed.key == currentMediaArtKey) {
                  currentMediaArtKey = null
                  MediaArtBus.update(null)
              }
              super.onNotificationRemoved(sbn)
          }
'''
          listener = listener[:removed_start] + removed + listener[removed_end:]

          listener = replace_once(
              listener,
              "        val call = CallNotificationParser.parse(sbn, this)\n        val prevOngoing = OnCallBus.state.value?.ongoing\n\n",
              "        val call = CallNotificationParser.parse(sbn, this)\n"
              "        val prevOngoing = OnCallBus.state.value?.ongoing\n\n"
              "        LiveActivityRegistry.coordinator.upsert(\n"
              "            SpecializedLiveActivityFactory.call(\n"
              "                packageName = sbn.packageName,\n"
              "                notificationKey = sbn.key,\n"
              "                callerLabel = call.callerLabel,\n"
              "                ongoing = call.ongoing,\n"
              "                nowElapsedRealtime = SystemClock.elapsedRealtime(),\n"
              "                contentIntent = sbn.notification.contentIntent,\n"
              "                actions = call.actions.map { action ->\n"
              "                    LiveActivity.Action(label = action.title, intent = action.intent)\n"
              "                },\n"
              "            ),\n"
              "        )\n\n",
              "call live bridge",
          )
          listener = replace_once(
              listener,
              "        val timer = TimerNotificationParser.parse(sbn)\n        RunningTimerBus.update(\n",
              "        val timer = TimerNotificationParser.parse(sbn)\n"
              "        LiveActivityRegistry.coordinator.upsert(\n"
              "            SpecializedLiveActivityFactory.timer(\n"
              "                packageName = sbn.packageName,\n"
              "                notificationKey = sbn.key,\n"
              "                label = timer.label,\n"
              "                endElapsedRealtimeMs = timer.endElapsedRealtimeMs,\n"
              "                pausedRemainingMs = timer.pausedRemainingMs,\n"
              "                nowElapsedRealtime = SystemClock.elapsedRealtime(),\n"
              "                contentIntent = sbn.notification.contentIntent,\n"
              "                actions = timer.actions.map { action ->\n"
              "                    LiveActivity.Action(label = action.title, intent = action.intent)\n"
              "                },\n"
              "            ),\n"
              "        )\n"
              "        RunningTimerBus.update(\n",
              "timer live bridge",
          )
          listener = replace_once(
              listener,
              "    /**\n     * Whether a notification should reach the island at all: drops the app's own notifications,\n",
              "    /** Explicit exclusions that must win even over promoted/native live evidence. */\n"
              "    private fun StatusBarNotification.isExplicitlyBlockedFromLiveRouting(): Boolean {\n"
              "        if (packageName == this@CutoutNotificationListenerService.packageName) return true\n"
              "        return notification.flags and Notification.FLAG_GROUP_SUMMARY != 0\n"
              "    }\n\n"
              "    /**\n     * Whether a notification should reach the island at all: drops the app's own notifications,\n",
              "explicit live block helper",
          )
          listener_path.write_text(listener)

          media_path = Path("app/src/main/java/com/ekoehler/expressivecutout/events/MediaPlaybackMonitor.kt")
          media = media_path.read_text()
          media = replace_once(
              media,
              "import com.ekoehler.expressivecutout.core.NowPlayingBus\n",
              "import com.ekoehler.expressivecutout.core.NowPlayingBus\n"
              "import com.ekoehler.expressivecutout.core.live.LiveActivityRegistry\n",
              "media registry import",
          )
          media = replace_once(
              media,
              "import com.ekoehler.expressivecutout.overlay.toArtImageBitmap\n",
              "import com.ekoehler.expressivecutout.overlay.toArtImageBitmap\n"
              "import com.ekoehler.expressivecutout.notifications.live.SpecializedLiveActivityFactory\n",
              "media factory import",
          )
          media = replace_once(
              media,
              "    private var showJob: Job? = null\n\n",
              "    private var showJob: Job? = null\n\n"
              "    /** Stable ID of the media session currently registered with the live coordinator. */\n"
              "    private var currentLiveMusicId: String? = null\n\n",
              "media live id field",
          )
          media = replace_once(
              media,
              "        clearPendingShow()\n        NowPlayingBus.update(null)\n",
              "        clearPendingShow()\n        clearLiveMusic()\n        NowPlayingBus.update(null)\n",
              "media stop cleanup",
          )
          media = replace_once(
              media,
              "    /** Forgets the surfaced track and drops any pop still waiting to fire. */\n    private fun clearPendingShow() {\n",
              "    /** Removes the media session currently registered in the process-wide live coordinator. */\n"
              "    private fun clearLiveMusic() {\n"
              "        currentLiveMusicId?.let(LiveActivityRegistry.coordinator::remove)\n"
              "        currentLiveMusicId = null\n"
              "    }\n\n"
              "    /** Forgets the surfaced track and drops any pop still waiting to fire. */\n"
              "    private fun clearPendingShow() {\n",
              "media clear helper",
          )
          media = replace_once(
              media,
              "        if (primary == null) {\n            NowPlayingBus.update(null)\n            clearPendingShow()\n            return\n        }\n",
              "        if (primary == null) {\n"
              "            NowPlayingBus.update(null)\n"
              "            clearPendingShow()\n"
              "            clearLiveMusic()\n"
              "            return\n"
              "        }\n",
              "media no session cleanup",
          )
          media = replace_once(
              media,
              "        if (isAssistantPackage(primary.packageName)) {\n            // Assistant sessions are handled exclusively via NotificationListenerService\n            NowPlayingBus.update(null)\n            clearPendingShow()\n            return\n        }\n",
              "        if (isAssistantPackage(primary.packageName)) {\n"
              "            // Assistant sessions are handled exclusively via NotificationListenerService\n"
              "            NowPlayingBus.update(null)\n"
              "            clearPendingShow()\n"
              "            clearLiveMusic()\n"
              "            return\n"
              "        }\n",
              "assistant media cleanup",
          )
          now_playing_block = '''        NowPlayingBus.update(
              NowPlaying(
                  packageName = primary.packageName,
                  title = title,
                  artist = artist,
                  albumArt = albumArt,
                  isPlaying = playing,
                  transport = ControllerTransport(primary),
                  progress = primary.progress(metadata, playing),
              ),
          )

'''
          live_music_block = now_playing_block + '''        val liveMusic = SpecializedLiveActivityFactory.music(
              packageName = primary.packageName,
              sessionId = primary.sessionToken.hashCode().toString(),
              title = title,
              artist = artist,
              isPlaying = playing,
              nowElapsedRealtime = SystemClock.elapsedRealtime(),
              contentIntent = primary.sessionActivity,
          )
          if (currentLiveMusicId != liveMusic.stableId) {
              clearLiveMusic()
              currentLiveMusicId = liveMusic.stableId
          }
          LiveActivityRegistry.coordinator.upsert(liveMusic)

'''
          media = replace_once(media, now_playing_block, live_music_block, "media coordinator upsert")
          media_path.write_text(media)

          timer_path = Path("app/src/main/java/com/ekoehler/expressivecutout/events/TimerNotificationParser.kt")
          timer = timer_path.read_text()
          timer = replace_once(
              timer,
              ''' *  - **Live Updates (Android 16+):** a "promoted ongoing" notification rendered with the
 *    `MetricStyle` template, whose critical metric is a counting-down time. Google Clock uses this;
 *    the remaining time lives in the metric's `value` bundle (`zeroElapsedRealtime` while running,
 *    `pausedDuration` while paused) — not in any title/text or the classic chronometer extras.
''',
              ''' *  - **Private/compat metric bundle:** some clock notifications expose an `android.metrics`
 *    payload whose critical value counts down. These extras are parsed defensively as a legacy/OEM
 *    fallback; they are not treated as the public Android 16 Live Update API. Public Android 16
 *    `ProgressStyle` handling lives in `notifications/live`.
''',
              "timer MetricStyle KDoc",
          )
          timer = timer.replace(
              "Whether this notification is a countdown timer, by either the modern metric extras or the",
              "Whether this notification is a countdown timer, by either the metric-bundle fallback or the",
              1,
          )
          timer = timer.replace(
              "The counting-down critical metric of a `MetricStyle` notification, or null if it isn't one.",
              "The counting-down critical metric from the private/compat bundle, or null if absent.",
              1,
          )
          timer = timer.replace(
              "The timer state a modern clock app publishes directly, before it is turned into a tile.",
              "The timer state recovered from the metric-bundle fallback before it becomes a tile.",
              1,
          )
          timer = timer.replace(
              "Keys the MetricStyle template stores its data under (mirrored by androidx\n     * NotificationCompat's MetricStyle). Read defensively — any missing key just means \"not a\n     * countdown we can read\".",
              "Private/compat metric keys observed in timer notifications. Read defensively — any\n     * missing key simply means this fallback cannot identify a countdown.",
              1,
          )
          timer_path.write_text(timer)
          PY

      - name: Verify patch shape
        shell: bash
        run: |
          git diff --check
          grep -q 'NotificationLiveActivityBridge' app/src/main/java/com/ekoehler/expressivecutout/service/CutoutNotificationListenerService.kt
          grep -q 'SpecializedLiveActivityFactory.music' app/src/main/java/com/ekoehler/expressivecutout/events/MediaPlaybackMonitor.kt
          ! grep -q 'MetricStyle.*Android 16' app/src/main/java/com/ekoehler/expressivecutout/events/TimerNotificationParser.kt

      - name: Commit wiring
        shell: bash
        run: |
          git config user.name "Jorgeprdz"
          git config user.email "JORGEPALACIOSRODRIGUEZ@GMAIL.COM"
          git rm .github/workflows/apply-live-wiring.yml
          git add app/src/main/java/com/ekoehler/expressivecutout/service/CutoutNotificationListenerService.kt
          git add app/src/main/java/com/ekoehler/expressivecutout/events/MediaPlaybackMonitor.kt
          git add app/src/main/java/com/ekoehler/expressivecutout/events/TimerNotificationParser.kt
          git commit -m "[FEAT] connect live activity producers"
          git push origin HEAD:feature/live-activities-dynamic-island
